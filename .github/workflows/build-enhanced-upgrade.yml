# Enhanced native controls on the modern official Windows-ready game loader.
# Unsigned candidate: NO guarantee SideStore can replace Windows Companion's signed app.
# NOTE: IPA structural success does not imply on-device JIT or extended-memory entitlement works.
name: Build Nexions Enhanced 1.7.0 (alpha 2, official v1.7.0)
# SwiftUI ViewBuilder hotfix: control settings now render multiple grouped sections.

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: 'Exact installed iPhone Bundle ID (TEAMID.slashplayed). Generic default is NOT safe as an in-place update.'
        required: false
        type: string
        default: 'slashplayed'
  push:
    branches: ['feature/nexions-1.7.0-diagnostics']
    paths:
      - .github/workflows/build-enhanced-upgrade.yml

permissions:
  contents: read

concurrency:
  group: nexions-170-diagnostics
  cancel-in-progress: false

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      XCODE_APP: /Applications/Xcode_27.1.app
      XCODEGEN_VERSION: 2.46.0
      XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
      RUSTUP_VERSION: 1.29.2
      RUSTUP_SHA256: f7c7e11eb2e07f006e532a8aaac77b32f4527d305ac386c0c633ca6133d35ca9
      IDEVICE_CACHE_PATHS: |
        work/idevice/BUILD.txt
        work/idevice/include
        work/idevice/ios
        work/idevice/xros
        work/idevice/macos
      SPAPPLE_CACHE_PATHS: |
        work/spapple/BUILD.txt
        work/spapple/ios
        work/spapple/xros
      BUNDLE_ID: ${{ inputs.bundle_id || 'slashplayed' }}

    steps:
      - name: Checkout full Enhanced source and port tooling
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pin official v1.7.0 release and overlay Enhanced controls
        shell: bash
        run: |
          set -euo pipefail
          ENHANCED_SHA="$GITHUB_SHA"
          git remote add official https://github.com/paulstraw/slashplayed.git
          git fetch --no-tags official 0e68bb83766c0a47aae4980fdab78e09ddcc91f1
          git show "$ENHANCED_SHA:apps/client/spsettings.swift" > "$RUNNER_TEMP/spsettings-enhanced.swift"
          git reset --hard 0e68bb83766c0a47aae4980fdab78e09ddcc91f1
          test "$(git rev-parse HEAD)" = 0e68bb83766c0a47aae4980fdab78e09ddcc91f1
          # Restore only the native touch input modules and WoW touch action bars.
          git checkout "$ENHANCED_SHA" -- \
            tools/port-enhanced-settings.py \
            shims/appkit/spevent-touch.m \
            shims/appkit/spnexionsmonitor.m \
            shims/appkit/spjoystick.m \
            shims/appkit/spthumb.m \
            shims/appkit/spkeys.m \
            addon/SPTouchBars/SPTouchBars.lua \
            addon/SPTouchBars/SPTouchBars.toc \
            addon/SPTouchBars/SPTouchBars.tga
          # Preserve modern official keyboard and text input, overlay only native touch controls.
          cp shims/appkit/spevent-touch.m shims/appkit/spevent.m
          grep -q sp_keyboard_forget shims/appkit/spevent.m
          grep -q sp_touch_key shims/appkit/spevent.m
          python3 - <<'PY'
          from pathlib import Path
          def replace_once(path, before, after):
              p=Path(path)
              s=p.read_text()
              assert s.count(before)==1, f"unexpected upstream source in {path}: {before[:100]}"
              p.write_text(s.replace(before,after))
          # Nexions alpha 2: record network-path and app-lifecycle events in the existing local console log.
          # No addresses, SSIDs, credentials, game packets or remote telemetry are collected.
          replace_once("apps/client/launcher.m", "#import <UIKit/UIKit.h>",
                       "#import <UIKit/UIKit.h>\n#import <Network/Network.h>")
          replace_once("apps/client/launcher.m",
                       "void sp_launch_say(NSString *s) { say(s); }  // spjit.m, sppair.m, and spvpn.m log through it",
                       """void sp_launch_say(NSString *s) { say(s); }  // spjit.m, sppair.m, and spvpn.m log through it
          
          static void nexions_network_diagnostics(void) {
              static nw_path_monitor_t monitor;
              static dispatch_queue_t queue;
              static dispatch_once_t once;
              dispatch_once(&once, ^{
                  queue = dispatch_queue_create("org.nexions.network-diagnostics", DISPATCH_QUEUE_SERIAL);
                  monitor = nw_path_monitor_create();
                  nw_path_monitor_set_queue(monitor, queue);
                  nw_path_monitor_set_update_handler(monitor, ^(nw_path_t path) {
                      nw_path_status_t status = nw_path_get_status(path);
                      say([NSString stringWithFormat:@"nexions: path uptime=%.3f status=%s wifi=%d cellular=%d wired=%d other=%d expensive=%d constrained=%d ipv4=%d ipv6=%d dns=%d",
                           NSProcessInfo.processInfo.systemUptime,
                           status == nw_path_status_satisfied ? "satisfied" : status == nw_path_status_satisfiable ? "satisfiable" : "unsatisfied",
                           nw_path_uses_interface_type(path, nw_interface_type_wifi),
                           nw_path_uses_interface_type(path, nw_interface_type_cellular),
                           nw_path_uses_interface_type(path, nw_interface_type_wired),
                           nw_path_uses_interface_type(path, nw_interface_type_other),
                           nw_path_is_expensive(path), nw_path_is_constrained(path),
                           nw_path_has_ipv4(path), nw_path_has_ipv6(path), nw_path_has_dns(path)]);
                  });
                  nw_path_monitor_start(monitor);
                  for (NSString *name in @[UISceneDidActivateNotification, UISceneWillDeactivateNotification,
                                            UISceneWillEnterForegroundNotification, UISceneDidEnterBackgroundNotification]) {
                      [NSNotificationCenter.defaultCenter addObserverForName:name object:nil queue:nil usingBlock:^(NSNotification *note) {
                          say([NSString stringWithFormat:@"nexions: lifecycle %@ uptime=%.3f", note.name,
                               NSProcessInfo.processInfo.systemUptime]);
                      }];
                  }
                  say(@"nexions: 1.7.0 alpha 2 diagnostics enabled; path status is not proof of CDN reachability");
              });
          }
          """)
          replace_once("apps/client/launcher.m", "    delete_listed();\n    write_free_space();",
                       "    nexions_network_diagnostics();\n    delete_listed();\n    write_free_space();")
          assert 'MARKETING_VERSION: "1.7.0"' in Path('apps/companion/project.yml').read_text()
          replace_once("apps/client/Info.plist", '<key>CFBundleVersion</key><string>1</string>',
                       '<key>CFBundleVersion</key><string>1702</string>')
          # Extend launcher CDN diagnostics: only status/byte counts and timings, not URLs.
          # This covers the launcher downloads; the guest game's TACT transfers are separate.
          replace_once("apps/client/spcdn.m", "    config.waitsForConnectivity = NO;\n    NSURLSession *session",
                       "    config.waitsForConnectivity = NO;\n    config.allowsCellularAccess = YES;\n    NSURLSession *session")
          replace_once("apps/client/spcdn.m", "        [task resume];\n        while (!atomic_load(&done))",
                       "        double nexionsStart = NSProcessInfo.processInfo.systemUptime;\n        [task resume];\n        while (!atomic_load(&done))")
          replace_once("apps/client/spcdn.m", "        before += body.length;\n        if (!body) *problem = why;",
                       """        fprintf(stderr, "[sp:nexions] launcher CDN %s bytes=%llu elapsed=%.3f error=%s\\n",
                          body ? "ok" : "failed", (unsigned long long)MAX(task.countOfBytesReceived, 0),
                          NSProcessInfo.processInfo.systemUptime - nexionsStart,
                          body ? "none" : (why.UTF8String ?: "unknown"));
                  before += body.length;
                  if (!body) *problem = why;""")
          # The touch joystick must learn when the game first renders.
          replace_once("shims/appkit/spuikit.m",
              "static BOOL sp_scene_active;",
              "static atomic_bool sp_game_presented;\nstatic BOOL sp_scene_active;")
          replace_once("shims/appkit/sploading.m",
              "static void sp_loading_frame(void) {\n",
              "static void sp_loading_frame(void) {\n"
              "#if !TARGET_OS_VISION\n"
              "    if (!atomic_exchange(&sp_game_presented, true))\n"
              "        dispatch_async(dispatch_get_main_queue(), ^{\n"
              "            [NSNotificationCenter.defaultCenter postNotificationName:@\"SPGameFirstFrame\" object:nil];\n"
              "        });\n"
              "#endif\n")
          # Add the Nexions HUD without touching the existing game loader, signature or pairing.
          replace_once("shims/appkit/spuikit.m",
              "static atomic_bool sp_game_presented;",
              "static atomic_bool sp_game_presented;\n"
              "static atomic_bool sp_nexions_count_frames;\n"
              "static _Atomic uint64_t sp_nexions_frames;")
          replace_once("shims/appkit/sploading.m",
              "static void sp_loading_frame(void) {\n",
              "static void sp_loading_frame(void) {\n"
              "#if !TARGET_OS_VISION\n"
              "    if (atomic_load_explicit(&sp_nexions_count_frames, memory_order_relaxed))\n"
              "        atomic_fetch_add_explicit(&sp_nexions_frames, 1, memory_order_relaxed);\n"
              "#endif\n")
          monitor = Path("shims/appkit/spnexionsmonitor.m").read_text()
          replace_once("shims/appkit/spevent.m",
              "@interface SPInputView : UIView <UIPointerInteractionDelegate, UIEditMenuInteractionDelegate>",
              monitor + "\n@interface SPInputView : UIView <UIPointerInteractionDelegate, UIEditMenuInteractionDelegate>")
          replace_once("shims/appkit/spevent.m",
              "    NSArray<SPKeyboardButton *> *_keyboardButtons;\n",
              "    NSArray<SPKeyboardButton *> *_keyboardButtons;\n"
              "    SPNexionsMonitor *_nexionsMonitor;\n")
          replace_once("shims/appkit/spevent.m",
              "    NSNotificationCenter *notifications = NSNotificationCenter.defaultCenter;",
              "    _nexionsMonitor = [[SPNexionsMonitor alloc] initWithFrame:CGRectZero];\n"
              "    [self addSubview:_nexionsMonitor];\n"
              "    UILongPressGestureRecognizer *five = [[UILongPressGestureRecognizer alloc] initWithTarget:_nexionsMonitor action:@selector(toggleGesture:)];\n"
              "    five.numberOfTouchesRequired = 5;\n"
              "    five.minimumPressDuration = .35;\n"
              "    five.allowableMovement = 24;\n"
              "    five.allowedTouchTypes = @[@(UITouchTypeDirect)];\n"
              "    five.delaysTouchesBegan = NO;\n"
              "    five.delaysTouchesEnded = NO;\n"
              "    five.cancelsTouchesInView = YES;\n"
              "    [self addGestureRecognizer:five];\n"
              "    NSNotificationCenter *notifications = NSNotificationCenter.defaultCenter;")
          replace_once("shims/appkit/spevent.m",
              "    [_joystick layoutInRect:CGRectIntersection(safe, sp_game_rect())];\n",
              "    [_joystick layoutInRect:CGRectIntersection(safe, sp_game_rect())];\n"
              "    [_nexionsMonitor layoutInRect:CGRectIntersection(safe, sp_game_rect())];\n")
          replace_once("shims/appkit/spevent.m",
              "    [_joystick gameDidStart];\n",
              "    [_joystick gameDidStart];\n"
              "    if ([NSUserDefaults.standardUserDefaults boolForKey:SPNexionsMonitorOnStartKey]) [_nexionsMonitor showMonitor];\n")
          replace_once("shims/appkit/spevent.m",
              "    [_thumbButton cancelHold];\n    for (SPKeyboardButton *button in _keyboardButtons) [button cancelInput];",
              "    [_nexionsMonitor hideMonitor];\n"
              "    [_thumbButton cancelHold];\n    for (SPKeyboardButton *button in _keyboardButtons) [button cancelInput];")
          # The Space button is visible by default so a second finger can jump while running.
          replace_once("shims/appkit/spkeys.m",
              "BOOL enabled = [defaults boolForKey:_enabledKey];  // optional buttons start hidden",
              "BOOL enabled = ![defaults objectForKey:_enabledKey] ? (_usage == 0x2C) : [defaults boolForKey:_enabledKey];")
          # Ship touch action bars inside the IPA, and let the official launcher place them on device.
          replace_once("scripts/release/device-kit.sh",
              "for a in SPMovie SPHover SPKeyboard; do",
              "for a in SPMovie SPHover SPKeyboard SPTouchBars; do")
          replace_once("scripts/release/device-kit.sh",
              "      cp \"$ROOT/addon/$a/$a.toc\" \"$ROOT/addon/$a/$a.lua\" \"$APP/addons/$a/\"\n",
              "      cp \"$ROOT/addon/$a/$a.toc\" \"$ROOT/addon/$a/$a.lua\" \"$APP/addons/$a/\"\n"
              "      [ \"$a\" != SPTouchBars ] || cp \"$ROOT/addon/$a/$a.tga\" \"$APP/addons/$a/\"\n")
          replace_once("apps/client/spcdn.m",
              "for (NSString *name in hover ? @[@\"SPMovie\", @\"SPHover\"] : @[@\"SPMovie\", @\"SPKeyboard\"])",
              "for (NSString *name in hover ? @[@\"SPMovie\", @\"SPHover\"] : @[@\"SPMovie\", @\"SPKeyboard\", @\"SPTouchBars\"])")
          replace_once("apps/client/spcdn.m",
              "for (NSString *ext in @[@\"toc\", @\"lua\"])",
              "for (NSString *ext in ([name isEqualToString:@\"SPTouchBars\"] ? @[@\"toc\", @\"lua\", @\"tga\"] : @[@\"toc\", @\"lua\"]))")
          PY
          python3 tools/port-enhanced-settings.py apps/client/spsettings.swift "$RUNNER_TEMP/spsettings-enhanced.swift"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("apps/client/spsettings.swift")
          s = p.read_text()
          key = '            Section("Enhanced On-screen Controls") {'
          assert s.count(key) == 1
          s = s.replace(key, '''            Section("Nexions Performance Monitor") {
                          Toggle("Show at game start", isOn: Binding(
                              get: { UserDefaults.standard.bool(forKey: "sp_nexions_monitor_on_start") },
                              set: { UserDefaults.standard.set($0, forKey: "sp_nexions_monitor_on_start"); settings.reload() }))
                          Text("Hold five fingers briefly to show or hide the monitor. Drag it to move it; tap × to close. Disk growth is an estimate, not network throughput.")
                              .font(.footnote).foregroundStyle(.secondary)
                      }
          ''' + key)
          p.write_text(s)
          PY
          grep -q 'Nexions Performance Monitor' apps/client/spsettings.swift
          grep -q 'five.numberOfTouchesRequired = 5' shims/appkit/spevent.m
          grep -q 'sp_nexions_frames' shims/appkit/sploading.m
          grep -q 'Enhanced On-screen Controls' apps/client/spsettings.swift
          grep -q 'Button("Forget Apple Token"' apps/client/spsettings.swift
          grep -q 'NavigationLink("Addons"' apps/client/spsettings.swift
          test -f apps/client/spguest.c
          test -f apps/client/spguestlaunch.m
          test -f shims/appkit/spjoystick.m
          test -f addon/SPTouchBars/SPTouchBars.lua
          # Verify the release's pairing, helper, network wait and Apple authentication files are untouched.
          git diff --exit-code HEAD -- apps/client/spvpn.m apps/client/sppair.m apps/client/spjit.m apps/client/spguestlaunch.m apps/client/spapple.m apps/client/spapple/src/lib.rs apps/client/helper apps/client/spvpnscreen.swift apps/companion-rs/src/account.rs
          grep -q 'sp_net_wait(pump, region)' apps/client/launcher.m
          echo "Official v1.7.0 release fixes retained; Enhanced touch controls and monitor ported"
      - name: Verify official loader and select Xcode
        shell: bash
        run: |
          set -euo pipefail
          test -f addon/SPTouchBars/SPTouchBars.lua
          test -f scripts/release/device-kit.sh
          test -f .github/actions/companion-deps/action.yml || test -f .github/actions/companion-deps/action.yaml
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
      - name: Prepare pinned dependencies
        uses: ./.github/actions/companion-deps
      - name: Fetch font and license
        shell: bash
        run: scripts/fetch-font.sh
      - name: Build unsigned official-loader touch device kit
        shell: bash
        run: |
          set -euo pipefail
          sh apps/companion/bundle-resources.sh --build "$RUNNER_TEMP/resources"
          scripts/release/device-kit.sh "$RUNNER_TEMP/resources" "$RUNNER_TEMP/slashplayed-device-kit.zip"
      - name: Package Enhanced upgrade candidate IPA and Windows-compatible kit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging dist Payload
          unzip -q "$RUNNER_TEMP/slashplayed-device-kit.zip" -d staging
          python3 - <<'PY'
          import os, plistlib
          from pathlib import Path
          bid = os.environ["BUNDLE_ID"]
          import re
          assert re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9.-]*", bid) and "." in bid or bid == "slashplayed", "invalid Bundle ID"
          app = Path("staging/ios/Slashplayed.app")
          helper = app / "PlugIns/SPJitHelper.appex"
          for p, ident in ((app/"Info.plist", bid), (helper/"Info.plist", bid+".helper")):
              with p.open("rb") as f: data = plistlib.load(f)
              assert data["CFBundleIdentifier"] == "@BUNDLE_ID@", (p, data["CFBundleIdentifier"])
              data["CFBundleIdentifier"] = ident
              if p.name == "Info.plist" and p.parent == app:
                  data["CFBundleShortVersionString"] = "1.7.0"
                  data["CFBundleVersion"] = "1702"
              with p.open("wb") as f: plistlib.dump(data, f)
          for p in (app/"slashplayed", helper/"SPJitHelper", app/"addons/SPTouchBars/SPTouchBars.lua"):
              assert p.is_file(), f"missing runtime/control component: {p}"
          with open("dist/app-entitlements.plist", "wb") as f:
              plistlib.dump({"get-task-allow": True,
                             "com.apple.developer.kernel.increased-memory-limit": True,
                             "com.apple.developer.kernel.extended-virtual-addressing": True}, f)
          with open("dist/helper-entitlements.plist", "wb") as f:
              plistlib.dump({"get-task-allow": True}, f)
          print("Bundle identifier:", bid, "; touch addon present")
          PY
          APP=staging/ios/Slashplayed.app
          for lib in "$APP"/Frameworks/*.dylib; do
            codesign --force --sign - "$lib"
          done
          codesign --force --sign - --entitlements dist/helper-entitlements.plist "$APP/PlugIns/SPJitHelper.appex"
          codesign --force --sign - --entitlements dist/app-entitlements.plist "$APP"
          codesign --verify --deep --strict "$APP"
          cp -R "$APP" Payload/
          zip -q -X -r dist/Slashplayed-Full-Enhanced-UPGRADE-CANDIDATE.ipa Payload
          cp "$RUNNER_TEMP/slashplayed-device-kit.zip" dist/
          shasum -a 256 dist/Slashplayed-Full-Enhanced-UPGRADE-CANDIDATE.ipa dist/slashplayed-device-kit.zip > dist/SHA256SUMS
          python3 - <<'PY'
          import os, plistlib, zipfile
          with zipfile.ZipFile("dist/Slashplayed-Full-Enhanced-UPGRADE-CANDIDATE.ipa") as z:
              app = "Payload/Slashplayed.app/"
              assert plistlib.loads(z.read(app+"Info.plist"))["CFBundleIdentifier"] == os.environ["BUNDLE_ID"]
              assert plistlib.loads(z.read(app+"PlugIns/SPJitHelper.appex/Info.plist"))["CFBundleIdentifier"] == os.environ["BUNDLE_ID"]+".helper"
              assert app+"addons/SPTouchBars/SPTouchBars.lua" in z.namelist()
          with zipfile.ZipFile("dist/slashplayed-device-kit.zip") as z:
              import json
              assert json.loads(z.read("kit.json"))["version"] == "1.7.0"
              app = "ios/Slashplayed.app/"
              main = plistlib.loads(z.read(app+"Info.plist"))
              helper = plistlib.loads(z.read(app+"PlugIns/SPJitHelper.appex/Info.plist"))
              assert main["CFBundleShortVersionString"] == "1.7.0"
              assert main["CFBundleVersion"] == "1702"
              assert main["CFBundleIdentifier"] == "@BUNDLE_ID@"
              assert helper["CFBundleIdentifier"] == "@BUNDLE_ID@"
              assert app+"addons/SPTouchBars/SPTouchBars.lua" in z.namelist()
          print("IPA and Windows kit structurally valid; on-device JIT, LTE, and renewal NOT verified")
          PY
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: slashplayed-nexions-170-alpha2
          path: |
            dist/Slashplayed-Full-Enhanced-UPGRADE-CANDIDATE.ipa
            dist/slashplayed-device-kit.zip
            dist/SHA256SUMS
          retention-days: 7
          if-no-files-found: error
