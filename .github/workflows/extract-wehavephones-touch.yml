# Standalone extraction of the actual WoW Lua UI addon from the public Android source.
# The Android-native touchscreen joystick, keyboard and menus are not part of this ZIP.
name: Extract WeHavePhonesTouch v0.0.13

on:
  push:
    branches: [feature/official-touch]
    paths:
      - .github/workflows/extract-wehavephones-touch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch pinned upstream Lua addon and its license
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "WeHavePhonesTouch" "dist"
          BASE="https://raw.githubusercontent.com/ashmerra/wehavephones/v0.0.13"
          curl -fLSs --retry 3 "$BASE/app/src/wehavephones/assets/wehavephones/addons/WeHavePhonesTouch/Touch.lua" -o WeHavePhonesTouch/Touch.lua
          test "$(git hash-object WeHavePhonesTouch/Touch.lua)" = 4b2ed32ae4e939cb76f3ca3a16e317fc8fba54d4
          curl -fLSs --retry 3 "$BASE/LICENSE" -o WeHavePhonesTouch/LICENSE.txt
          cat > WeHavePhonesTouch/WeHavePhonesTouch.toc <<'EOF'
          ## Interface: 16001
          ## Title: WeHavePhones Touch (extracted)
          ## Notes: Interface layout for touch on WoW Forever; the Android-native controls are not included.
          ## Author: WeHavePhones contributors (ashmerra/wehavephones)
          ## Version: 0.0.13-standalone
          ## SavedVariablesPerCharacter: WeHavePhonesTouchDB

          Mode.lua
          Touch.lua
          EOF
          cat > WeHavePhonesTouch/Mode.lua <<'EOF'
          local _, addon = ...
          addon.enabled = true
          addon.scale = 1.5
          addon.wheel = false
          EOF
          cat > WeHavePhonesTouch/README.txt <<'EOF'
          WeHavePhonesTouch — extracted from WeHavePhones v0.0.13
          Original source: https://github.com/ashmerra/wehavephones
          Revision: v0.0.13, Touch.lua git blob 4b2ed32ae4e939cb76f3ca3a16e317fc8fba54d4
          LICENSE: upstream project's LICENSE.txt

          This is only the WoW Lua interface-layout addon. The joystick,
          on-screen buttons, touch menus and simultaneous finger handling are
          Android Java/native app components and cannot run in WoW on iOS.

          WoW Forever: place WeHavePhonesTouch folder in Interface/AddOns/,
          then enable it at character selection. Disable other action-bar
          layout addons (for example SPTouchBars) while evaluating it.
          This has not been tested on Slashplayed, and may interfere with
          existing chat/frame positions, action bar binding overrides, or
          the current touch layout. Back up SavedVariables and UI settings.

          Mode.lua is regenerated by the original Android application.
          It was reconstructed here using source v0.0.13 defaults:
          enabled=true, scale=1.5, wheel=false.
          You can change addon.scale to 1.25 or addon.wheel to true in Mode.lua
          while WoW is closed.

          If this doesn't work as expected, disable the addon and reload.
          EOF
          python3 - <<'PY'
          from pathlib import Path
          s=Path("WeHavePhonesTouch/Touch.lua").read_text()
          assert "WeHavePhonesTouchDB" in s and "local enabled = addon.enabled" in s
          assert len(s)>90000
          assert "Mode.lua\nTouch.lua\n" in Path("WeHavePhonesTouch/WeHavePhonesTouch.toc").read_text()
          print("Verified original Lua code; generated WoW Forever standalone addon loader.")
          PY
          zip -q -X -r dist/WeHavePhonesTouch-v0.0.13-WoW-Forever.zip WeHavePhonesTouch
          sha256sum dist/*.zip > dist/SHA256SUMS
          unzip -l dist/*.zip | tail -15

      - name: Publish standalone addon ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="wehavephones-touch-v0.0.13-extracted"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/WeHavePhonesTouch-v0.0.13-WoW-Forever.zip dist/SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/WeHavePhonesTouch-v0.0.13-WoW-Forever.zip dist/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "WeHavePhonesTouch v0.0.13 — WoW Forever standalone Lua addon" \
              --prerelease \
              --notes "Source-exact Lua file extracted from ashmerra/wehavephones v0.0.13, with Android-generated Mode.lua and addon TOC reconstructed for WoW Forever Interface 16001. Android-native touch joystick/buttons, touch menu and input layer are not included. **Not tested on iPhone/Slashplayed**; may conflict with existing UI addons. Upstream project: https://github.com/ashmerra/wehavephones. Original license included."
          fi
